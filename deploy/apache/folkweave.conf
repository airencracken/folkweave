<VirtualHost *:443>
 ServerName folkweave.example.org
 SSLEngine on
 SSLCertificateFile /etc/letsencrypt/live/folkweave.example.org/fullchain.pem
 SSLCertificateKeyFile /etc/letsencrypt/live/folkweave.example.org/privkey.pem
 ProxyPreserveHost On
 RequestHeader set X-Forwarded-Proto "https"
 ProxyPass / http://127.0.0.1:8084/
 ProxyPassReverse / http://127.0.0.1:8084/
 LimitRequestBody 17825792
</VirtualHost>
