services:
  folkweave:
    image: ghcr.io/airencracken/folkweave:v0.1.0
    ports:
      - "127.0.0.1:8084:8080"
    environment:
      FOLKWEAVE_BASE_URL: ${FOLKWEAVE_BASE_URL:-https://folkweave.example.org}
    volumes:
      - folkweave-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 20s
volumes:
  folkweave-data:
