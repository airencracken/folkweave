services:
  folkweave:
    image: folkweave:dev
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      FOLKWEAVE_BASE_URL: ${FOLKWEAVE_BASE_URL:-http://localhost:8084}
    volumes:
      - folkweave-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 15s
volumes:
  folkweave-data:
